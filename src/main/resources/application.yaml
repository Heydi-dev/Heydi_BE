# 공통 설정 (Git 커밋). 비밀값은 application-local.yaml 또는 서버 env에서 주입.
spring:
  config:
    import: optional:classpath:application-local.yaml

  application:
    name: Heydi-BE

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  session:
    timeout: 1800
    cookie:
      http-only: true
      secure: ${SESSION_COOKIE_SECURE:false}
      same-site: ${SESSION_COOKIE_SAME_SITE:lax}
      name: JSESSIONID
      path: /

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
            scope:
              - email
              - profile
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            scope:
              - profile_nickname
              - account_email
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

server:
  port: 8080
  address: 0.0.0.0
  forward-headers-strategy: framework

aws:
  s3:
    bucket: heydi-dev-storage
    region: ap-southeast-2
    access-key: ${AWS_S3_ACCESS_KEY}
    secret-key: ${AWS_S3_SECRET_KEY}
    presigned:
      expire-seconds: 3600

app:
  report:
    monthly:
      include-only-marked: false
  profile-image-base-url: https://heydi-dev-storage.s3.ap-southeast-2.amazonaws.com
  default-profile-image-key: profiles/default.png
  post-image-base-url: https://heydi-dev-storage.s3.ap-southeast-2.amazonaws.com
  diary-image-base-url: https://heydi-dev-storage.s3.ap-southeast-2.amazonaws.com
  frontend:
    base-url: ${APP_FRONTEND_BASE_URL:http://localhost:5173}
    oauth:
      success-redirect: /login/success
      failure-redirect: /login/failure
  ai-server:
    base-url: http://localhost:8000
    ws-path-template: /api/v1/model/ws/conversations?user_id=%d
    endpoints:
      generate-topic: /api/v1/model/topic
      generate-emotion: /api/v1/model/emotion
      generate-diary: /api/v1/model/diary
      generate-summary: /api/v1/model/summary
      generate-preferences: /api/v1/model/preferences
      generate-monthly-activity: /api/v1/model/monthly-activity
      generate-monthly-feedback: /api/v1/model/monthly-feedback
